name: publish-desktop-release
# Copies desktop release assets from this private repo to the public
# distribution repo algorithco/algorithvoice-app (which hosts downloads).
#
# Usage (after desktop artifacts land on the private release):
#   gh workflow run publish-desktop-release -f tag=v0.2.5
#
# Requires repo secret PUBLIC_REPO_PAT: a fine-grained PAT with
# Contents: read+write on algorithco/algorithvoice-app only.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.2.5)"
        required: true
        default: v0.2.5
        type: string

permissions:
  contents: read

jobs:
  publish:
    # Configure this environment with required reviewers and restrict the
    # fine-grained PUBLIC_REPO_PAT secret to it. Rotate before its expiry.
    environment: desktop-public-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download private release assets + notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ inputs.tag }}"
          mkdir -p dist-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist-assets
          ls -la dist-assets
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > NOTES-public.md
          {
            echo ""
            echo "---"
            echo "Built from the private development repo. Report issues via the website."
          } >> NOTES-public.md

      - name: Point updater manifest at public downloads
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import quote

          assets = Path("dist-assets")
          manifest_path = assets / "latest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          tag = os.environ["RELEASE_TAG"]
          base = f"https://github.com/algorithco/algorithvoice-app/releases/download/{quote(tag, safe='')}"

          appimage = next(assets.glob("*.AppImage"))
          deb = next(assets.glob("*.deb"))
          windows = next(assets.glob("*-setup.exe"))
          public_urls = {
              "linux-x86_64": f"{base}/{quote(appimage.name)}",
              "linux-x86_64-appimage": f"{base}/{quote(appimage.name)}",
              "linux-x86_64-deb": f"{base}/{quote(deb.name)}",
              "windows-x86_64": f"{base}/{quote(windows.name)}",
              "windows-x86_64-nsis": f"{base}/{quote(windows.name)}",
          }

          for platform, url in public_urls.items():
              if platform in manifest["platforms"]:
                  manifest["platforms"][platform]["url"] = url

          manifest_path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          private_urls = [
              item["url"]
              for item in manifest["platforms"].values()
              if "algorithco/algorithvoice/releases/assets" in item["url"]
          ]
          if private_urls:
              raise SystemExit("latest.json still contains private release URLs")
          PY

      - name: Create or update public release
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_PAT }}
        run: |
          set -e
          TAG="${{ inputs.tag }}"
          PUB="algorithco/algorithvoice-app"
          if ! gh release view "$TAG" --repo "$PUB" >/dev/null 2>&1; then
            VER="${TAG#v}"
            gh release create "$TAG" --repo "$PUB" \
              --title "Algorith Voice v$VER" \
              --notes-file NOTES-public.md
          fi
          gh release upload "$TAG" --repo "$PUB" --clobber dist-assets/*
          echo "Published $TAG to $PUB"
          gh release view "$TAG" --repo "$PUB" --json url,assets --jq '{url, assets: [.assets[].name]}'
