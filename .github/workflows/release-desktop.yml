name: release-desktop
on:
  push:
    tags: ["v*.*.*", "v*.*.*-*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (e.g. 0.2.0) — used when dispatching without a tag"
        required: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      # One target failing must not cancel the other OS builds.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # Fail fast on tag/config version skew: tauri-action's v__VERSION__
      # release would otherwise diverge from the git tag that triggered us.
      - name: version consistency gate
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          CARGO=$(grep -m1 '^version' apps/desktop-tauri/src-tauri/Cargo.toml | cut -d'"' -f2)
          CONF=$(python3 -c "import json;print(json.load(open('apps/desktop-tauri/src-tauri/tauri.conf.json'))['version'])")
          PKG=$(node -p "require('./apps/desktop-tauri/package.json').version")
          [ "$TAG" = "$CARGO" ] && [ "$TAG" = "$CONF" ] && [ "$TAG" = "$PKG" ] || { echo "tag v$TAG != cargo $CARGO / conf $CONF / pkg $PKG"; exit 1; }
      - name: signing secrets preflight
        shell: bash
        run: |
          [ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ] || { echo "TAURI_SIGNING_PRIVATE_KEY missing — updater artifacts would be unsigned"; exit 1; }
      - name: manifest signature check
        shell: bash
        run: |
          pip install pynacl
          python apps/desktop-tauri/src-tauri/scripts/sign-manifest.py check --manifest apps/desktop-tauri/src-tauri/src/local_asr/default_manifest.json --pubkey apps/desktop-tauri/src-tauri/src/local_asr/manifest_signing_pubkey.hex
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libappindicator3-dev patchelf
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages (required for desktop typecheck)
        run: |
          pnpm --filter @algorith-voice/shared-types build
          pnpm --filter @algorith-voice/ui build
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop-tauri
          tagName: v__VERSION__
          releaseName: "Algorith Voice v__VERSION__"
          releaseBody: "Desktop app (Windows + Linux) — see attached -setup.exe (Windows NSIS installer), .AppImage/.deb (Linux), plus .sig/latest.json updater files. Public downloads: https://github.com/algorithco/algorithvoice-app/releases/latest"
          args: --target ${{ matrix.target }}
