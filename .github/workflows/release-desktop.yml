name: release-desktop
on:
  push:
    tags: ["v*.*.*", "v*.*.*-*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (e.g. 0.2.0) — used when dispatching without a tag"
        required: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      # One target failing must not cancel the other OS builds.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libappindicator3-dev patchelf
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages (required for desktop typecheck)
        run: |
          pnpm --filter @algorith-voice/shared-types build
          pnpm --filter @algorith-voice/ui build
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Unsigned CI builds: empty APPLE_SIGNING_IDENTITY would override
          # tauri.conf's ad-hoc "-" (env wins over config), so default to "-".
          # Set the APPLE_SIGNING_IDENTITY secret for real signed releases.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          # NOTE: APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID are intentionally
          # NOT set here. Tauri attempts notarization whenever these env vars
          # exist (even empty) and fails on the empty Team ID. Re-add all three
          # together when real Apple Developer credentials are available.
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: "Algorith Voice v__VERSION__"
          releaseBody: "Desktop app — see attached .dmg (macOS), .msi (Windows), .AppImage/.deb (Linux). Public downloads: https://github.com/algorithco/algorithvoice-app/releases/latest"
          args: --target ${{ matrix.target }}
