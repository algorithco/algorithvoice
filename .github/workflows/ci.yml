name: ci
on:
  pull_request:
    branches: [main, develop, "release/*"]
    paths-ignore: ['**.md', 'docs/**', 'assets/**']
  push:
    branches: [main, develop, "release/*", "hotfix/*"]
    tags: ["v*.*.*", "v*.*.*-*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: algorith
          POSTGRES_PASSWORD: algorith
          POSTGRES_DB: algorith_voice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://algorith:algorith@localhost:5432/algorith_voice_test?schema=public
      REDIS_URL: redis://localhost:6379
      # Build-time placeholder; deployments must provide their real API_URL.
      API_URL: http://127.0.0.1:3001
      JWT_ACCESS_SECRET: ci-only-access-secret-min-32-chars!!
      JWT_REFRESH_PEPPER: ci-only-refresh-pepper-at-least-32-chars
      ENCRYPTION_KEK: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:versions
      - run: pnpm exec biome check .
      # Generate Prisma client and build workspace packages before typecheck (backend/desktop need ui/shared-types)
      - run: pnpm --filter @algorith-voice/shared-types build
      - run: pnpm --filter @algorith-voice/ui build
      - run: pnpm --filter @algorith-voice/backend exec prisma generate --schema ../../infra/prisma/schema.prisma
      - run: pnpm --filter @algorith-voice/backend exec prisma migrate deploy --schema ../../infra/prisma/schema.prisma
      - run: pnpm -r run typecheck
      - run: pnpm -r run test
      - run: pnpm -r run build

  integration-tests:
    name: backend integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: algorith
          POSTGRES_PASSWORD: algorith
          POSTGRES_DB: algorith_voice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://algorith:algorith@localhost:5432/algorith_voice_test?schema=public
      REDIS_URL: redis://localhost:6379
      API_URL: http://127.0.0.1:3001
      JWT_ACCESS_SECRET: ci-only-access-secret-min-32-chars!!
      JWT_REFRESH_PEPPER: ci-only-refresh-pepper-at-least-32-chars
      ENCRYPTION_KEK: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @algorith-voice/shared-types build
      - run: pnpm --filter @algorith-voice/backend exec prisma generate --schema ../../infra/prisma/schema.prisma
      - run: pnpm --filter @algorith-voice/backend exec prisma migrate deploy --schema ../../infra/prisma/schema.prisma
      - run: pnpm --filter @algorith-voice/backend exec vitest run ./test/

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Compose intentionally requires explicit database/cache passwords. These
      # values are CI-only inputs used to validate interpolation, not deployed
      # credentials.
      POSTGRES_PASSWORD: ci-compose-postgres-only
      REDIS_PASSWORD: ci-compose-redis-only
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Repo-root context is required (monorepo workspace + shared-types).
      - run: docker build -f apps/backend/Dockerfile -t algorith-voice-backend:ci .
      - run: docker build -f apps/web/Dockerfile -t algorith-voice-web:ci .
      # Fails on invalid compose (bad env interpolation, missing files).
      - run: docker compose -f infra/docker-compose.yml config --quiet

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/path" zricethezav/gitleaks:v8.22.1 detect --source="/path" --no-banner --redact --verbose || {
            CODE=$?
            if [ $CODE -eq 1 ]; then
              echo "Leaks found"
              exit 1
            elif [ $CODE -eq 0 ]; then
              echo "No leaks"
              exit 0
            else
              echo "gitleaks error $CODE — failing closed (do not ship with scanner failure)"
              exit 1
            fi
          }

  rust-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable commit 2026-09-03
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libappindicator3-dev patchelf
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop-tauri/src-tauri -> target
      # Tauri's build script checks frontendDist exists — create a stub for clippy
      - run: mkdir -p apps/desktop-tauri/dist && echo '<!doctype html><title>stub</title>' > apps/desktop-tauri/dist/index.html
      - run: cargo fmt --check --manifest-path apps/desktop-tauri/src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path apps/desktop-tauri/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path apps/desktop-tauri/src-tauri/Cargo.toml
      # Fast fail-closed gate for the model-manifest signature (no Rust build
      # needed). The release build enforces the same structurally via
      # src-tauri/build.rs, and `cargo test` above proves cryptographic
      # validity (`bundled_manifest_verifies_against_baked_pubkey`).
      - name: model-manifest signature check
        run: |
          pip install pynacl --quiet
          python3 apps/desktop-tauri/src-tauri/scripts/sign-manifest.py check \
            --manifest apps/desktop-tauri/src-tauri/src/local_asr/default_manifest.json \
            --pubkey apps/desktop-tauri/src-tauri/src/local_asr/manifest_signing_pubkey.hex
      - name: "cargo audit (native surface: sherpa-onnx/keyring/rusqlite/enigo)"
        working-directory: apps/desktop-tauri/src-tauri
        run: |
          cargo install cargo-audit --locked
          cargo audit --deny warnings --ignore RUSTSEC-2024-0370 --ignore RUSTSEC-2025-0081 --ignore RUSTSEC-2025-0075 --ignore RUSTSEC-2025-0080 --ignore RUSTSEC-2025-0100 --ignore RUSTSEC-2025-0098 --ignore RUSTSEC-2024-0429
