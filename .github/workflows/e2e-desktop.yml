name: e2e-desktop
on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*", "v*.*.*-*"]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  e2e-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    # Heavier than unit tests; only on dispatch / releases, not every PR
    # (see apps/desktop-tauri/e2e/README.md). Windows is the release target;
    # Linux would additionally need xvfb + WebKit deps.
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-tauri/src-tauri -> target
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pynacl --quiet
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @algorith-voice/shared-types build
      - run: pnpm --filter @algorith-voice/ui build
      # Manifest signature fast gate (no Rust build needed)
      - name: model-manifest signature check
        run: python apps/desktop-tauri/src-tauri/scripts/sign-manifest.py check --manifest apps/desktop-tauri/src-tauri/src/local_asr/default_manifest.json --pubkey apps/desktop-tauri/src-tauri/src/local_asr/manifest_signing_pubkey.hex
      # Real frontend is required: the debug binary serves frontendDist and
      # tauri's generate_context! fails the compile when dist/ is missing.
      # The WebDriver suite then drives the real multi-window UI.
      - name: build desktop frontend
        run: pnpm --filter @algorith-voice/desktop build
      # Debug binary is enough for E2E (faster than --release).
      # WebView2 + Edge are preinstalled on windows-latest.
      - name: build desktop (debug)
        run: cargo build --manifest-path apps/desktop-tauri/src-tauri/Cargo.toml
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
      - name: install tauri-driver
        # Pinned: the driver speaks the native-driver protocol, so it must
        # move in lockstep with tauri/cli (floating broke nothing yet, but a
        # silent major bump would). Bump deliberately with Tauri upgrades.
        run: cargo install tauri-driver --version 2.0.6 --locked
      - name: run tauri-driver E2E
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
          # Must match CARGO_TARGET_DIR above: the test defaults to a stale
          # hardcoded D:\ path that no longer exists (first real E2E run
          # failed all 4 tests with "no msedge binary at ...").
          TAURI_APP_PATH: ${{ runner.temp }}/cargo-target/debug/algorith-voice-desktop.exe
        run: pnpm --filter @algorith-voice/desktop e2e
      - name: upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-windows
          path: apps/desktop-tauri/e2e/screenshots/
          if-no-files-found: warn
