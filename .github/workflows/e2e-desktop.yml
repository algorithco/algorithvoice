name: e2e-desktop
on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*", "v*.*.*-*"]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  e2e-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    # Heavier than unit tests; only on dispatch / releases, not every PR
    # (see apps/desktop-tauri/e2e/README.md). Windows is the release target;
    # Linux would additionally need xvfb + WebKit deps.
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-tauri/src-tauri -> target
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pynacl --quiet
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @algorith-voice/shared-types build
      - run: pnpm --filter @algorith-voice/ui build
      # Manifest signature fast gate (no Rust build needed)
      - name: model-manifest signature check
        run: python apps/desktop-tauri/src-tauri/scripts/sign-manifest.py check --manifest apps/desktop-tauri/src-tauri/src/local_asr/default_manifest.json --pubkey apps/desktop-tauri/src-tauri/src/local_asr/manifest_signing_pubkey.hex
      # Real frontend is required: the debug binary serves frontendDist and
      # tauri's generate_context! fails the compile when dist/ is missing.
      # The WebDriver suite then drives the real multi-window UI.
      - name: build desktop frontend
        run: pnpm --filter @algorith-voice/desktop build
      # Debug binary is enough for E2E (faster than --release).
      # WebView2 + Edge are preinstalled on windows-latest.
      - name: build desktop (debug)
        run: cargo build --manifest-path apps/desktop-tauri/src-tauri/Cargo.toml
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
      # DIAGNOSTIC (debug branch only): does the debug binary stay alive on
      # the runner? Captures early-exit code, which tauri-driver swallows
      # behind SessionNotCreatedError.
      - name: smoke-boot debug binary (diagnostic)
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
        shell: pwsh
        run: |
          $exe = "${{ runner.temp }}/cargo-target/debug/algorith-voice-desktop.exe"
          Write-Host "exists: $(Test-Path $exe)"
          $p = Start-Process -FilePath $exe -RedirectStandardOutput "$env:RUNNER_TEMP/app-out.log" -RedirectStandardError "$env:RUNNER_TEMP/app-err.log" -PassThru
          Start-Sleep -Seconds 20
          $alive = Get-Process -Id $p.Id -ErrorAction SilentlyContinue
          if ($alive) { Write-Host "APP ALIVE pid=$($p.Id)"; Stop-Process -Id $p.Id -Force; Start-Sleep -Seconds 3 }
          else { Write-Host "APP EXITED hasExited=$($p.HasExited)" }
          Write-Host "--- app stdout ---"; Get-Content "$env:RUNNER_TEMP/app-out.log" -ErrorAction SilentlyContinue | Select-Object -First 30
          Write-Host "--- app stderr ---"; Get-Content "$env:RUNNER_TEMP/app-err.log" -ErrorAction SilentlyContinue | Select-Object -First 30
      - name: install tauri-driver
        run: cargo install tauri-driver --locked
      # DIAGNOSTIC (debug branch only): versions that must line up for
      # WebView2 attach (Edge Runtime vs msedgedriver vs wry SDK).
      - name: dump webview versions (diagnostic)
        shell: pwsh
        run: |
          $edge = "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe"
          if (Test-Path $edge) { Write-Host "edge: $((Get-Item $edge).VersionInfo.FileVersion)" }
          Get-ChildItem "C:\Program Files (x86)\Microsoft\EdgeWebView\Application" -ErrorAction SilentlyContinue | Select-Object Name
          & msedgedriver --version 2>&1 | Select-Object -First 2
          & tauri-driver --help 2>&1 | Select-Object -First 3
      - name: run tauri-driver E2E
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
          # Must match CARGO_TARGET_DIR above: the test defaults to a stale
          # hardcoded D:\ path that no longer exists (first real E2E run
          # failed all 4 tests with "no msedge binary at ...").
          TAURI_APP_PATH: ${{ runner.temp }}/cargo-target/debug/algorith-voice-desktop.exe
          # DIAGNOSTIC (debug branch only): enable WebView2 remote debugging
          # so msedgedriver can attach (DevToolsActivePort). Inherited by the
          # app through tauri-driver -> node -> app process chain.
          WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: --remote-debugging-port=9222
        run: pnpm --filter @algorith-voice/desktop e2e
      - name: upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-windows
          path: apps/desktop-tauri/e2e/screenshots/
          if-no-files-found: warn
      # DIAGNOSTIC (debug branch only): hunt the DevToolsActivePort file the
      # driver waits for — tells us whether any WebView wrote it and where.
      - name: hunt DevToolsActivePort (diagnostic)
        if: always()
        shell: pwsh
        run: |
          foreach ($root in @($env:APPDATA, $env:LOCALAPPDATA, $env:TEMP, "${{ runner.temp }}/cargo-target/debug")) {
            Write-Host "== $root"
            Get-ChildItem -Path $root -Filter "DevToolsActivePort" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName | Select-Object -First 5
          }
          Get-Process algorith-voice-desktop -ErrorAction SilentlyContinue | Select-Object Id, StartTime
