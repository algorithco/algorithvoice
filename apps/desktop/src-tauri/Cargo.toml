[package]
name = "algorith-voice-desktop"
version = "0.2.6"
edition = "2021"

[lib]
name = "algorith_voice_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2.10"
tauri-plugin-store = "2.4"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2.4", features = ["deep-link"] }
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# Phase 2 voice pipeline (pinned per plan):
# cpal 0.17, rubato 0.16, ort load-dynamic + silero 0.7,
# whisper-rs 0.16, enigo 0.6.1, arboard 1.3, rusqlite bundled, keyring 3
rusqlite = { version = "0.40", features = ["bundled"] }
keyring = "3"
dirs = "6"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
