[package]
name = "algorith-voice-desktop"
version = "0.5.2"
edition = "2021"

[lib]
name = "algorith_voice_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2.10"
tauri-plugin-store = "2.4"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2.4", features = ["deep-link"] }
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
url = "2"
# Phase 2 voice pipeline (pinned per plan):
# cpal 0.17, rubato 0.16, ort load-dynamic + silero 0.7,
# whisper-rs 0.16, enigo 0.6.1, arboard 1.3, rusqlite bundled, keyring 3
rusqlite = { version = "0.40", features = ["bundled"] }
keyring = "3"
dirs = "6"
# Push-to-talk floating pill (additive only, versions pinned to avoid drift):
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "multipart",
  "json",
] }
base64 = "0.22"
arboard = "3"
enigo = "0.6"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
# Local speech recognition (Spike 0: sherpa-onnx static build + Parakeet TDT).
# The crate links its bundled ONNX Runtime statically; no Python needed.
sherpa-onnx = "1.13.6"
# Local model manager: checksums (reuse locked 0.10.x) + disk-space probes.
sha2 = "0.10"
sysinfo = "0.39"
# Dynamic NVML probe for NVIDIA GPUs (no link-time dep: machines without a
# driver behave identically minus GPU fields). Reuses the locked 0.7.x.
libloading = "0.7"
# Manifest signing (Ed25519 over canonical models JSON). Verifies
# default_manifest.json before trusting URLs/checksums; fails closed when a
# signature is present and invalid. See manifest.rs.
# NEEDS PRODUCT INPUT: signing key provisioning + release pipeline.
ed25519-dalek = "2"
hex = "0.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
