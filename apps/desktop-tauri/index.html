<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Algorith Voice</title>
    <style>
      /* Transparent first paint: the floating pill (72x72, transparent
         window) loads this same file and must never flash — or stick on —
         black. The main/settings windows keep their native #000 behind
         this (tauri.conf backgroundColor) plus their own shell bg, so a
         transparent page changes nothing for them. */
      html,
      body {
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <noscript>Algorith Voice needs JavaScript to run.</noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
