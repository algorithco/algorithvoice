# ------------------------------------------------------------------
# Algorith Voice — local / self-host stack.
#
# Two supported workflows (same file):
#
#   1. Native dev (default) — only infra in Docker, code on the host:
#        cp .env.example .env
#        docker compose -f infra/docker-compose.yml up -d postgres redis
#        pnpm install && pnpm db:generate && pnpm db:migrate && pnpm dev
#
#   2. Full stack in Docker — everything containerized:
#        cp .env.example .env   # then set real JWT_* values
#        docker compose -f infra/docker-compose.yml up -d --build
#        Public web https://app.trqsh.uz · API https://api.trqsh.uz
#        Local health ports remain 127.0.0.1:3000 and 127.0.0.1:3001.
#
# OAuth and browser-facing URLs use the deployed trqsh.uz hosts. Loopback is
# used only for container health checks and host port exposure.
#
# Env: service-to-service URLs below default to Compose DNS
# (postgres/redis/backend). Secrets come from the repo-root `.env`
# (env_file). Build-time NEXT_PUBLIC_* come from your SHELL environment
# (export NEXT_PUBLIC_API_URL=... before `up --build`); root `.env` values
# do NOT reach build args. Never commit `.env` — see `.env.example`.
# Run all commands from the REPO ROOT.
# ------------------------------------------------------------------
name: algorith-voice

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  app:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  sttaudio:

services:
  postgres:
    image: postgres:16-alpine
    networks: [app]
    logging: *default-logging
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-algorith}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-algorith_voice}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-algorith} -d ${POSTGRES_DB:-algorith_voice}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    networks: [app]
    logging: *default-logging
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot schema migration. Re-runs safely on every `up` (migrate
  # deploy is idempotent); backend/worker gate on its success.
  migrate:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    # Tagged so prebuilt images can run without rebuilding:
    #   docker compose build && docker compose up -d --no-build
    image: algorith-voice-backend:local
    networks: [app]
    logging: *default-logging
    restart: "no"
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-algorith}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-algorith_voice}?schema=public
    command: ["prisma", "migrate", "deploy", "--schema", "infra/prisma/schema.prisma"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    image: algorith-voice-backend:local
    networks: [app]
    logging: *default-logging
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-algorith}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-algorith_voice}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      STT_STORAGE_BACKEND: local
      STT_TEMP_DIR: /var/lib/algorith-voice/stt
      APP_URL: https://app.trqsh.uz
      API_URL: https://api.trqsh.uz
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY_HOPS: "0"
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      - sttaudio:/var/lib/algorith-voice/stt
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    image: algorith-voice-backend:local
    networks: [app]
    logging: *default-logging
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-algorith}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-algorith_voice}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      STT_STORAGE_BACKEND: local
      STT_TEMP_DIR: /var/lib/algorith-voice/stt
      APP_URL: https://app.trqsh.uz
      API_URL: https://api.trqsh.uz
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Same image, different process (see apps/backend/src/queues/worker.ts).
    command: ["node", "apps/backend/dist/queues/worker.js"]
    volumes:
      - sttaudio:/var/lib/algorith-voice/stt
    # No HTTP listener here — the image HEALTHCHECK targets :3001 (API).
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: https://app.trqsh.uz
        NEXT_PUBLIC_API_URL: https://api.trqsh.uz
        NEXT_PUBLIC_STRIPE_PRICE_PRO: ${NEXT_PUBLIC_STRIPE_PRICE_PRO:-}
        NEXT_PUBLIC_STRIPE_PRICE_PRO_MONTHLY: ${NEXT_PUBLIC_STRIPE_PRICE_PRO_MONTHLY:-${NEXT_PUBLIC_STRIPE_PRICE_PRO:-}}
        NEXT_PUBLIC_STRIPE_PRICE_PRO_YEARLY: ${NEXT_PUBLIC_STRIPE_PRICE_PRO_YEARLY:-}
        NEXT_PUBLIC_GITHUB_REPO: ${NEXT_PUBLIC_GITHUB_REPO:-algorithco/algorithvoice-app}
    image: algorith-voice-web:local
    networks: [app]
    logging: *default-logging
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      PORT: 3000
      # Server-side BFF proxy target (Compose DNS — NOT localhost).
      API_URL: http://backend:3001
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
