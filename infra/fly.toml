app = "algorith-voice-api"
primary_region = "fra"

[build]
  # Path is relative to the REPO ROOT: deploy with
  #   flyctl deploy --config infra/fly.toml
  # run from the repo root so the monorepo (pnpm workspace +
  # shared-types) is the Docker build context.
  dockerfile = "apps/backend/Dockerfile"

[deploy]
  # Migrations run before machines swap — a schema change can never
  # boot against a stale database. `prisma` is installed globally in
  # the image (runner stage); the schema + migrations ship at
  # /app/infra/prisma. Replaces CMD, keeps ENTRYPOINT (tini).
  release_command = "prisma migrate deploy --schema infra/prisma/schema.prisma"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[http_service.checks]
  [http_service.checks.alive]
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  kill_signal = "SIGTERM"
  kill_timeout = 15

[env]
  PORT = "3001"
  NODE_ENV = "production"
  APP_URL = "https://app.trqsh.uz"
  API_URL = "https://api.trqsh.uz"
  # API and worker run on separate Machines, so async audio must use R2.
  STT_STORAGE_BACKEND = "r2"
  # Fly adds one trusted proxy hop before the app.
  TRUST_PROXY_HOPS = "1"

[processes]
  app = "node apps/backend/dist/server.js"
  worker = "node apps/backend/dist/queues/worker.js"

# Required secrets (fly secrets set ...):
#   DATABASE_URL, REDIS_URL, JWT_ACCESS_SECRET, JWT_REFRESH_PEPPER,
#   AUDIT_HASH_KEY, OPENROUTER_API_KEY, STRIPE_SECRET_KEY,
#   STRIPE_WEBHOOK_SECRET, R2_ACCOUNT_ID, R2_ACCESS_KEY_ID,
#   R2_SECRET_ACCESS_KEY
