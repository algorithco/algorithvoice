app = "algorith-voice-api"
primary_region = "fra"

[build]
  dockerfile = "apps/backend/Dockerfile"

[deploy]
  # Migrations run before machines swap — a schema change can never
  # boot against a stale database.
  release_command = "npx prisma migrate deploy --schema infra/prisma/schema.prisma"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[http_service.checks]
  [http_service.checks.alive]
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  kill_timeout = 15

[env]
  PORT = "3001"
  NODE_ENV = "production"

[processes]
  app = "node apps/backend/dist/server.js"
  worker = "node apps/backend/dist/queues/worker.js"

# Required secrets (fly secrets set ...):
#   DATABASE_URL, REDIS_URL, JWT_ACCESS_SECRET, JWT_REFRESH_PEPPER,
#   ENCRYPTION_KEK, OPENROUTER_API_KEY, STRIPE_SECRET_KEY,
#   STRIPE_WEBHOOK_SECRET
